<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" />
    <meta
      name="description"
      content="A little better, every day. ANGELO is a quiet space to build your daily habits, one check-in at a time."
    />
    <title>ANGELO — The daily practice</title>
    <script>
      // Paint the chosen theme before the app loads, so it never flashes in the default one.
      try {
        var theme = localStorage.getItem('angelo-theme-v1')
        if (theme && /^[a-z][a-z-]{0,31}$/.test(theme)) document.documentElement.dataset.theme = theme
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
