name: Deploy backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Google Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          # Supports Workload Identity Federation (recommended) or Service Account Key
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy angelo-api \
            --source backend \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION || 'us-central1' }}" \
            --service-account "${{ vars.GCP_SERVICE_ACCOUNT || format('angelo-api@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}" \
            --allow-unauthenticated \
            --memory 512Mi \
            --concurrency 20 \
            --max-instances 3 \
            --set-env-vars "NODE_ENV=production,DATA_STORE=firestore,ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }}"
